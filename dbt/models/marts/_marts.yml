version: 2

models:
  - name: dim_region
    columns:
      - name: region_code
        tests: [unique, not_null]

  - name: dim_bnf_chapter
    columns:
      - name: bnf_chapter_code
        tests: [unique, not_null]

  - name: fct_prescribing_monthly
    description: Monthly prescribing volume and cost per NHS region x BNF chapter.
    tests:
      - unique_combination:
          arguments:
            combination_of_columns: [series_id, month_start]
    columns:
      - name: series_id
        tests: [not_null]
      - name: month_start
        tests: [not_null]
      - name: region_code
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_region')
                field: region_code
          - accepted_values:
              arguments:
                values: "{{ var('expected_regions') }}"
              config: {severity: warn}
      - name: bnf_chapter_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_bnf_chapter')
                field: bnf_chapter_code
      - name: items
        tests: [non_negative]
      - name: is_missing
        description: True where a series has no data for a month inside the observed range.
        tests:
          - accepted_values:
              arguments:
                values: [false]
                quote: false
              config: {severity: warn}
