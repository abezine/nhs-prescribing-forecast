name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Synthetic data (same schema as the API extract)
        run: python scripts/make_sample_data.py
      - name: dbt build (models + data quality tests)
        run: cd dbt && dbt build --profiles-dir .
      - name: Unit tests
        run: pytest -q
      - name: Backtest + train
        run: python -m rxforecast.train
